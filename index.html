<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>مكتب المجد العقاري</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.7.0/dist/maplibre-gl.css"><link rel="stylesheet" href="style.css"></head><body><main class="map-app"><div id="publicMap" class="real-map"></div><div class="top-overlay"><div class="map-toolbar"><button class="icon-btn" id="locateBtn" aria-label="موقعي">⌾</button><button class="office-pill" aria-label="مكتب المجد العقاري"><span>⌂</span><b>مكتب المجد العقاري</b><small>●</small></button><button class="add-btn" onclick="openSubmission()">إضافة عقار <span>＋</span></button><button class="menu-btn" onclick="toggleMenu()" aria-label="القائمة"><i></i><i></i><i></i></button></div><div class="category-row"><button class="category active" data-deal="all">الكل <em id="countAll">0</em></button><button class="category" data-deal="sale">للبيع <em id="countSale">0</em></button><button class="category" data-deal="rent">للإيجار <em id="countRent">0</em></button><button class="category" data-deal="land">أراضي <em id="countLand">0</em></button></div><div class="search-panel"><div class="search-field"><span>⌕</span><input id="searchInput" type="search" placeholder="ابحث عن حي أو نوع عقار..."></div><select id="dealFilter"><option value="all">كل العمليات</option><option value="sale">للبيع</option><option value="rent">للإيجار</option></select><select id="typeFilter"><option value="all">كل الأنواع</option><option value="apartment">شقة</option><option value="house">منزل</option><option value="villa">فيلا</option><option value="land">أرض</option><o
